# =============================================================================
# CI/CD pipeline - Secure Event Ticketing Platform
#
# Faze:
#   1. test                -> npm ci, sintaksna provjera, npm audit (gate: high)
#   2. secrets-scan        -> gitleaks (traži tajne u povijesti repozitorija)
#   3. lint-containerfiles -> hadolint + trivy config (IaC skeniranje k8s/ manifesta)
#   4. build-scan-push     -> build slike, Trivy quality gate, push u GHCR
#
# Slike se objavljuju SAMO s grane `main` i SAMO ako Trivy quality gate prođe.
# =============================================================================

name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Minimalne potrebne ovlasti (princip najmanjih privilegija).
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ikovacek95
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Testovi i provjera ovisnosti (matrica po servisima)
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, worker]
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Postavljanje Node.js okoline
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Deterministicka instalacija ovisnosti (npm ci)
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Sintaksna provjera izvornog koda (node --check)
        working-directory: ${{ matrix.service }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "GRESKA: nema .js datoteka u src/"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check ${f}"
            node --check "${f}"
          done

      - name: "Provjera ranjivosti ovisnosti (npm audit, gate: high)"
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # 2. Skeniranje tajni u repozitoriju
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Skeniranje tajni (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout koda (puna povijest)
        uses: actions/checkout@v4
        with:
          # gitleaks skenira cijelu git povijest, ne samo zadnji commit.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. Linting Containerfile-ova i IaC skeniranje Kubernetes manifesta
  # ---------------------------------------------------------------------------
  lint-containerfiles:
    name: Lint Containerfile + IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Hadolint - api/Containerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Containerfile
          failure-threshold: warning

      - name: Hadolint - frontend/Containerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Containerfile
          failure-threshold: warning

      - name: Hadolint - worker/Containerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: worker/Containerfile
          failure-threshold: warning

      # Trivy config = statička analiza Kubernetes manifesta (misconfiguration).
      # Korak je izvještajni (exit-code 0); nalazi se prate u Security tabu.
      - name: Trivy config - skeniranje k8s/ manifesta (tablica)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: config
          scan-ref: k8s/
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy config - SARIF izvjestaj
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: config
          scan-ref: k8s/
          format: sarif
          output: trivy-k8s-config.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload IaC nalaza u GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-k8s-config.sarif
          category: trivy-k8s-config

  # ---------------------------------------------------------------------------
  # 4. Build slike -> Trivy quality gate -> push u GHCR
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build/Scan/Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, secrets-scan, lint-containerfiles]
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, worker]
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Postavljanje Docker Buildxa
        uses: docker/setup-buildx-action@v3

      - name: Prijava na GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Slika se gradi JEDNOM i učitava u lokalni docker daemon (`load: true`)
      # kako bi je Trivy mogao skenirati PRIJE nego što se objavi u registry.
      - name: Build slike (lokalno, bez pusha)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Containerfile
          target: runtime
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ticketing-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy - SARIF izvjestaj o ranjivostima slike
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ticketing-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload nalaza u GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      # QUALITY GATE: pipeline pada ako postoji ijedna HIGH/CRITICAL ranjivost
      # za koju POSTOJI ispravak (ignore-unfixed: true). Slika se tada NE objavljuje.
      - name: "Trivy QUALITY GATE (HIGH,CRITICAL -> pipeline pada)"
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ticketing-${{ matrix.service }}:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Objava se radi TEK nakon uspjesnog gatea i samo s grane main.
      - name: Push slike u GHCR (git-sha + latest)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ticketing-${{ matrix.service }}
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "Objavljeno: ${IMAGE}:${GITHUB_SHA} i ${IMAGE}:latest" >> "${GITHUB_STEP_SUMMARY}"
