# =============================================================================
# Lokalno razvojno/produkcijsko okruženje - 1. dio projekta
#
# Pokretanje (CentOS Stream 9, rootless Podman):
#   cp .env.example .env
#   podman-compose up -d --build
#
# NAPOMENA O SELINUXU:
#   Svaki bind-mount s hosta mora imati oznaku `:Z` (privatni relabel) ili `:z`
#   (dijeljeni relabel). Bez toga SELinux u enforcing modu blokira pristup i
#   kontejner javlja "Permission denied".
# =============================================================================

name: ticketing

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - trajna pohrana obrađenih narudžbi
  # ---------------------------------------------------------------------------
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: ticketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-ticketing_user}
      # Vrijednost dolazi IZ .env datoteke (koja je u .gitignore).
      # `change_me_local` je samo placeholder identičan onom u .env.example -
      # NIKADA ga ne koristiti izvan lokalnog labosa.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      # Podatke držimo u poddirektoriju volumena (izbjegava sukob s lost+found).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Imenovani volume => podaci preživljavaju `podman-compose down`.
      - pgdata:/var/lib/postgresql/data
      # Inicijalizacijska skripta se izvršava SAMO pri prvoj inicijalizaciji baze.
      # `:ro,Z` -> read-only + SELinux relabel (obavezno na CentOS-u!)
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ticketing_user} -d ${POSTGRES_DB:-ticketing}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - ticketing
    # Baza NIJE izložena na host - dostupna je samo unutar compose mreže.
    expose:
      - "5432"

  # ---------------------------------------------------------------------------
  # Redis - queue između API-ja i workera
  # ---------------------------------------------------------------------------
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: ticketing-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - ticketing
    expose:
      - "6379"

  # ---------------------------------------------------------------------------
  # API - REST sučelje
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Containerfile
      target: runtime
    image: localhost/ticketing-api:local
    container_name: ticketing-api
    restart: unless-stopped
    # Dovoljno da se zapoceti HTTP zahtjevi dovrse prije zatvaranja servera.
    stop_grace_period: 30s
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-8080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-ticketing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_NAME: ${QUEUE_NAME:-ticket_orders}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Ojačavanje kontejnera (isti principi kao securityContext u Kubernetesu).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ticketing

  # ---------------------------------------------------------------------------
  # Worker - pozadinska obrada queue poruka (nema HTTP porta)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Containerfile
      target: runtime
    image: localhost/ticketing-worker:local
    container_name: ticketing-worker
    restart: unless-stopped
    # Worker moze biti usred obrade narudzbe (poruka je vec uzeta iz Redisa, ali
    # jos nije upisana u PostgreSQL). Zadanih 10 s nije uvijek dovoljno, a prekid
    # u toj tocki znacio bi TRAJAN GUBITAK narudzbe. Zato mu dajemo 30 s, jednako
    # kao `terminationGracePeriodSeconds` u k8s/07-worker.yaml.
    stop_grace_period: 30s
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-ticketing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_NAME: ${QUEUE_NAME:-ticket_orders}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f src/worker.js > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ticketing

  # ---------------------------------------------------------------------------
  # Frontend - statički UI + /config endpoint
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
      target: runtime
    image: localhost/ticketing-frontend:local
    container_name: ticketing-frontend
    restart: unless-stopped
    # Dovoljno da se zapoceti HTTP zahtjevi dovrse prije zatvaranja servera.
    stop_grace_period: 30s
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      # VAŽNO: ovo je adresa koju vidi PREGLEDNIK na hostu, a ne interno ime
      # servisa u compose mreži. Preglednik ne zna razriješiti "http://api:8080".
      API_BASE_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ticketing

# -----------------------------------------------------------------------------
# Imenovani volumeni - perzistencija podataka između restarta
# -----------------------------------------------------------------------------
volumes:
  pgdata:
    name: ticketing_pgdata
  redisdata:
    name: ticketing_redisdata

networks:
  ticketing:
    name: ticketing_net
    driver: bridge
