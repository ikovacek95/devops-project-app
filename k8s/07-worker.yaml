# =============================================================================
# Worker - pozadinski consumer Redis queuea.
#
# NEMA Servicea jer ne izlaže nijedan port (nije mrežno dostupan).
# Liveness se zato radi `exec` provjerom da glavni Node.js proces još postoji.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ticketing
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: ticketing
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/instance: ticketing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/instance: ticketing
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: ticketing
    spec:
      serviceAccountName: ticketing-sa
      automountServiceAccountToken: false
      # Worker pri SIGTERM-u prestaje uzimati NOVE poruke, ali do kraja dovrsava
      # onu koju trenutno obraduje. Poruka je u tom trenutku vec uklonjena iz
      # Redisa, a jos nije upisana u PostgreSQL - prekid bi znacio TRAJAN GUBITAK
      # narudzbe. Ovih 30 s je s velikom rezervom dovoljno: najgori slucaj je
      # BRPOP timeout (1 s) + trajanje jednog INSERT-a.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Vidi napomenu o taggiranju u k8s/06-api.yaml.
          image: ghcr.io/ikovacek95/ticketing-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ticketing-config
            - secretRef:
                name: ticketing-secret
          # Worker nema HTTP endpoint, pa se provjerava postojanje procesa.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "src/worker.js" > /dev/null
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "src/worker.js" > /dev/null
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
