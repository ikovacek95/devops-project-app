# =============================================================================
# PostgreSQL - StatefulSet s trajnim diskom (PVC) + headless Service
#
# NAPOMENA O UID-u: službena slika `postgres:16-alpine` sadrži korisnika
# `postgres` s UID/GID 70. Zato se OVDJE ne koristi UID 10001 (koji vrijedi za
# vlastite aplikacijske slike api/worker/frontend), nego 70 - inače entrypoint
# ne može inicijalizirati bazu. Sva ostala ojačanja (runAsNonRoot, drop ALL,
# seccomp RuntimeDefault, readOnlyRootFilesystem) ostaju identična.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: ticketing
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ticketing
data:
  # Identičan sadržaj kao infra/postgres/init.sql (koji koristi compose).
  # Skripta se izvršava samo pri PRVOJ inicijalizaciji prazne baze.
  init.sql: |
    CREATE TABLE IF NOT EXISTS ticket_orders (
        id SERIAL PRIMARY KEY,
        order_id TEXT UNIQUE NOT NULL,
        event_id TEXT NOT NULL,
        customer_email TEXT NOT NULL,
        quantity INTEGER NOT NULL CHECK (quantity > 0),
        status TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_ticket_orders_created_at ON ticket_orders (created_at DESC);
---
# Headless Service (clusterIP: None) - obavezan za StatefulSet, daje stabilan
# DNS zapis postgres-0.postgres.ticketing.svc.cluster.local.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ticketing
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ticketing
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: ticketing
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ticketing
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ticketing
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: ticketing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: ticketing
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ticketing
    spec:
      serviceAccountName: ticketing-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        # fsGroup osigurava da PVC bude zapisiv za korisnika postgres (GID 70).
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketing-secret
                  key: POSTGRES_PASSWORD
            # Podaci u poddirektoriju volumena - izbjegava sukob s lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Zbog readOnlyRootFilesystem: true postgres treba zapisive
            # emptyDir volumene za socket i privremene datoteke.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h /var/run/postgresql
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: ticketing
      spec:
        accessModes: ["ReadWriteOnce"]
        # `local-path` je zadana StorageClass koju k3s isporučuje out-of-the-box.
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
