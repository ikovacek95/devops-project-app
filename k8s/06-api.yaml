# =============================================================================
# API - REST servis (Deployment s 2 replike + ClusterIP Service)
#
# Rolling update strategija `maxSurge: 1, maxUnavailable: 0` garantira da tijekom
# nadogradnje uvijek postoje 2 spremna poda (nema pada dostupnosti).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ticketing
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ticketing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: ticketing
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ticketing
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ticketing
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: ticketing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: ticketing
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ticketing
    spec:
      serviceAccountName: ticketing-sa
      automountServiceAccountToken: false
      # Mora pokriti: SHUTDOWN_DRAIN_MS (5 s) + dovrsavanje zapocetih zahtjeva
      # + zatvaranje veza prema bazi i Redisu. Tek nakon isteka ovog roka
      # kubelet salje SIGKILL.
      terminationGracePeriodSeconds: 30
      # Replike se raspoređuju na različite čvorove ako ih ima (na jednočvornom
      # k3s klasteru pravilo je "best effort" i ne blokira raspoređivanje).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
              app.kubernetes.io/instance: ticketing
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # NAPOMENA O TAGU: `latest` je ovdje samo radi jednostavnijeg prvog
          # pokretanja u labosu. Prema politici objave (docs/security/image-scan-report.md)
          # u produkciji se koristi nepromjenjivi tag:
          #   kubectl -n ticketing set image deployment/api api=ghcr.io/ikovacek95/ticketing-api:<git-sha>
          image: ghcr.io/ikovacek95/ticketing-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ticketing-config
            - secretRef:
                name: ticketing-secret
          # startupProbe daje aplikaciji do 60 s da se podigne, a da je
          # livenessProbe u međuvremenu ne ubija.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # /readyz provjerava PostgreSQL i Redis - pod izlazi iz Servicea
          # čim izgubi vezu prema ovisnostima.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            # Root filesystem je read-only, pa Node.js dobiva zapisiv /tmp.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
