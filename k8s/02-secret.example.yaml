# =============================================================================
# PREDLOŽAK Secreta - u repozitorij ide SAMO ova datoteka s placeholderom.
#
# !!! NIKADA NE COMMITATI STVARNU LOZINKU !!!
#
# Preporučeni način kreiranja Secreta na k3s poslužitelju (bez datoteke u gitu):
#
#   kubectl create secret generic ticketing-secret \
#     --namespace ticketing \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
#
# Provjera (vrijednost je base64 kodirana, NIJE enkriptirana):
#   kubectl -n ticketing get secret ticketing-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
#
# Rotacija lozinke:
#   kubectl -n ticketing delete secret ticketing-secret
#   kubectl create secret generic ticketing-secret -n ticketing --from-literal=POSTGRES_PASSWORD='<nova>'
#   kubectl -n ticketing rollout restart deployment/api deployment/worker
#   kubectl -n ticketing rollout restart statefulset/postgres
#
# Ako se ipak koristi datoteka, kopirati je u `k8s/02-secret.yaml`
# (ta putanja je u .gitignore) i tek onda upisati stvarnu vrijednost.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ticketing-secret
  namespace: ticketing
  labels:
    app.kubernetes.io/name: ticketing-secret
    app.kubernetes.io/part-of: ticketing
type: Opaque
stringData:
  # PLACEHOLDER - zamijeniti prije primjene ili koristiti `kubectl create secret`.
  POSTGRES_PASSWORD: "REPLACE_ME_PRIJE_PRIMJENE"
